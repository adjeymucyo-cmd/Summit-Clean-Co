<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;




        }

        form input {

            width: 200px;
            height: 25px;
            text-align: center;
        }

        button {
            width: 200px;
            height: 40px;
            border-radius: 20px;
            color: rgb(245, 243, 243);
            border: none;
            background-color: rgb(49, 114, 199);
            gap: 20px;
            padding:10px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            border: 2px solid gray;
            width: 300px;
            height: 600px;
            padding-left: 60px;
            box-shadow: 4px 1px 1px gray
        }
    </style>
</head>

<body>
    <form action="">
        <h1>Addition and multiplication program</h1>
        <label for="">Mathematics</label>
        <input type="number" id="num1" placeholder="Enter the first number"><br>
        <label for=""> Computer Literacy</label>
        <input type="number" id="num2" placeholder="Enter the second  number"><br>
        <label for="">Computer Maintenance</label>
        <input type="number" id="num3" placeholder="Enter the third number"><br>
        <label for="">Occupation</label>
        <input type="number" id="num4" placeholder="Enter the fourth  number"><br>
        <label for="">English</label>
        <input type="number" id="num5" placeholder="Enter the fiveth number"><br>
        <button onclick="calculate('+')"> Addition operator</button><br>
        <button onclick="calculate('*')"> multiplication operator</button>
        
        <h3 id="result">Result Appear Here:</h3>
    </form>
    <script>
        function calculate(operator) {
            let val1 = Number(document.getElementById("num1").value);
            let val2 = Number(document.getElementById("num2").value);
            let val3 = Number(document.getElementById("num3").value);
            let val4 = Number(document.getElementById("num4").value);
            let val5 = Number(document.getElementById("num5").value);
            let avg = 0;
            if (operator === "+") {
                avg = (val1 + val2 + val3 + val4 + val5) / 5;
                document.getElementById("result").innerText = "the average is equal: " + avg;
            }
            //else if (operator === '*') {
            //avg = val1 * varl2 * val3 * val4 * val5;
            // document.getElementById("result").innerText = "product:" + avg;

            if (avg >= 80 && avg <= 100) {
                alert("grade A");
            }
            else if (avg >= 70 && avg < 80) {
                alert("grade B")
            }
            else if (avg >= 60 && avg < 70) {
                alert("grade c")
            }
            else if (avg >= 50 && avg < 60) {
                alert("grade D")
            }
            else if (avg >= 0 && avg < 50) {
                alert("grade F")
            }
            else {
                alert("Invalid number")
            }


        }
    </script>
</body>

</html>
