<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkgreen;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Grade Calculator</h2>

    <label>Maths</label>
    <input type="number" id="maths" min="0" max="100">

    <label>English</label>
    <input type="number" id="english" min="0" max="100">

    <label>Economics</label>
    <input type="number" id="economics" min="0" max="100">

    <label>French</label>
    <input type="number" id="french" min="0" max="100">

    <label>Chemistry</label>
    <input type="number" id="chemistry" min="0" max="100">

    <button onclick="calculateGrade()">Calculate Grade</button>

    <div id="result"></div>
</div>

<script>
function calculateGrade() {

    let maths = Number(document.getElementById("maths").value);
    let english = Number(document.getElementById("english").value);
    let economics = Number(document.getElementById("economics").value);
    let french = Number(document.getElementById("french").value);
    let chemistry = Number(document.getElementById("chemistry").value);

    // Check for valid marks
    if (
        maths < 0 || maths > 100 ||
        english < 0 || english > 100 ||
        economics < 0 || economics > 100 ||
        french < 0 || french > 100 ||
        chemistry < 0 || chemistry > 100
    ) {
        document.getElementById("result").innerHTML =
            "Please enter marks between 0 and 100 for all modules.";
        return;
    }

    let average = (maths + english + economics + french + chemistry) / 5;

    let grade;

    if (average >= 80) {
        grade = "A";
    } else if (average >= 60) {
        grade = "B";
    } else if (average >= 50) {
        grade = "C";
    } else {
        grade = "F";
    }

    document.getElementById("result").innerHTML =
        "Average: <strong>" + average.toFixed(2) +
        "</strong><br>Grade: <strong>" + grade + "</strong>";
}
</script>

</body>
</html>
